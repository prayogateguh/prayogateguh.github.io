                }

                function renderSubscriptionCalendar() {
                    calendarMonthYearEl.textContent = trackerState.calendarDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                    
                    const year = trackerState.calendarDate.getFullYear();
                    const month = trackerState.calendarDate.getMonth();
                    
                    const monthlyTotals = getPaymentsForMonth(year, month);
                    const totalContainer = document.getElementById('calendar-monthly-total');
                    if (Object.keys(monthlyTotals).length > 0) {
                        totalContainer.innerHTML = 'Total: ' + Object.keys(monthlyTotals).map(currency => {
                            return formatCurrency(monthlyTotals[currency], currency);
                        }).join(' + ');
                    } else {
                        totalContainer.innerHTML = 'No payments this month';
                    }

                    const firstDayOfMonth = new Date(year, month, 1);
                    const lastDayOfMonth = new Date(year, month + 1, 0);
                    const daysInMonth = lastDayOfMonth.getDate();
                    
                    let startDay = firstDayOfMonth.getDay();
                    startDay = startDay === 0 ? 6 : startDay - 1; 

                    const today = new Date();
                    const todayDateString = new Date(today.getFullYear(), today.getMonth(), today.getDate()).toISOString().split('T')[0];

                    let html = `<div id="subscription-calendar" class="bg-white dark:bg-gray-800/80 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700/80">`;
                    html += `<div class="grid grid-cols-7 text-center font-semibold text-sm text-gray-600 dark:text-gray-400 border-b border-gray-200 dark:border-gray-700">`;
                    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(day => {
                        html += `<div class="py-3">${day}</div>`;
                    });
                    html += `</div>`;
                    
                    html += `<div class="grid grid-cols-7">`;
                    for (let i = 0; i < startDay; i++) {
                        html += `<div class="border-r border-b border-gray-200 dark:border-gray-700/80"></div>`;
                    }

                    for (let day = 1; day <= daysInMonth; day++) {
                        const date = new Date(year, month, day);
                        const isToday = date.toDateString() === today.toDateString();

                        const dayClasses = `calendar-day p-2 border-r border-b border-gray-200 dark:border-gray-700/80 relative ${isToday ? 'bg-indigo-50 dark:bg-indigo-900/20' : ''}`;
                        html += `<div class="${dayClasses}">`;
                        if (isToday) {
                            html += `<div class="today-bar"></div>`;
                        }
                        html += `<span class="text-sm font-medium ${isToday ? 'text-indigo-600 dark:text-indigo-400' : 'text-gray-700 dark:text-gray-300'}">${day}</span>`;
                        
                        const subsOnThisDay = getPaymentsForDay(date, subscriptions);
                        
                        if (subsOnThisDay.length > 0) {
                            html += `<div class="mt-1 space-y-1 overflow-y-auto max-h-20 pr-1">`;
                            subsOnThisDay.forEach(sub => {
                                const color = getColorsForString(sub.name);
                                html += `<div data-id="${sub.id}" class="edit-subscription-btn cursor-pointer text-xs p-1.5 rounded-md ${color.bg} ${color.darkBg} ${color.text} ${color.darkText} truncate" title="${sub.name}">${sub.name} - ${formatCurrency(monthlyTotals[sub.currency], sub.currency)}</div>`;
                            });
                            html += `</div>`;
                        }
                        
                        html += `</div>`;
                    }
                    html += `</div></div>`;
                    subscriptionCalendarView.innerHTML = html;
                }

                window.openSubscriptionModal = function(subId = null) {
                    subscriptionForm.reset();
                    document.getElementById('subscription-id').value = '';
                    cancellationDateContainer.classList.add('hidden');
                    if (subId) {
                        const sub = subscriptions.find(s => s.id === subId);
                        if (sub) {
                            document.getElementById('subscription-modal-title').textContent = 'Edit Subscription';
                            document.getElementById('subscription-id').value = sub.id;
                            document.getElementById('subscription-name').value = sub.name;
                            document.getElementById('subscription-price').value = sub.price;
                            document.getElementById('subscription-currency').value = sub.currency;
                            document.getElementById('subscription-frequency-count').value = sub.frequencyCount;
                            document.getElementById('subscription-frequency-unit').value = sub.frequencyUnit;
                            document.getElementById('subscription-next-payment').value = sub.nextPayment;
                            document.getElementById('subscription-payment-method').value = sub.paymentMethod || '';
                            subscriptionStatusEl.value = sub.status || 'active';
                            if (sub.status === 'cancelled') {
                                cancellationDateContainer.classList.remove('hidden');
                                document.getElementById('subscription-cancellation-date').value = sub.cancellationDate || '';
                            }
                        }
                    } else {
                        document.getElementById('subscription-modal-title').textContent = 'Add Subscription';
                        subscriptionStatusEl.value = 'active';
                    }
                    subscriptionModal.classList.remove('hidden');
                }

                window.closeSubscriptionModal = function() {
                    subscriptionModal.classList.add('hidden');
                }
                
                function refreshAllViews() {
                    if (trackerState.view === 'list') {
                        renderSubscriptionList(searchInput.value);
                    } else {
                        renderSubscriptionCalendar();
                    }
                }

                subscriptionStatusEl.addEventListener('change', (e) => {
                    if (e.target.value === 'cancelled') {
                        cancellationDateContainer.classList.remove('hidden');
                    } else {
                        cancellationDateContainer.classList.add('hidden');
                    }
                });

                addSubscriptionBtn.addEventListener('click', () => openSubscriptionModal());
                subscriptionModal.querySelector('#subscription-modal-close-btn').addEventListener('click', closeSubscriptionModal);
                subscriptionModal.querySelector('#subscription-form-cancel-btn').addEventListener('click', closeSubscriptionModal);

                subscriptionForm.addEventListener('submit', e => {
                    e.preventDefault();
                    const id = document.getElementById('subscription-id').value;
                    
                    const priceValue = document.getElementById('subscription-price').value;
                    const freqCountValue = document.getElementById('subscription-frequency-count').value;

                    const subData = {
                        name: document.getElementById('subscription-name').value,
                        price: priceValue ? parseFloat(priceValue) : 0,
                        currency: document.getElementById('subscription-currency').value,
                        frequencyCount: freqCountValue ? parseInt(freqCountValue) : 1,
                        frequencyUnit: document.getElementById('subscription-frequency-unit').value,
                        nextPayment: document.getElementById('subscription-next-payment').value,
                        paymentMethod: document.getElementById('subscription-payment-method').value,
                        status: subscriptionStatusEl.value,
                        cancellationDate: subscriptionStatusEl.value === 'cancelled' ? document.getElementById('subscription-cancellation-date').value : null
                    };

                    if (id) {
                        const index = subscriptions.findIndex(s => s.id === id);
                        if (index !== -1) {
                            subscriptions[index] = { ...subscriptions[index], ...subData };
                        }
                    } else {
                        subData.id = `sub-${Date.now()}`;
                        subscriptions.push(subData);
                    }
                    saveTrackerState();
                    refreshAllViews();
                    closeSubscriptionModal();
                });

                appTrackerContainer.addEventListener('click', e => {
                    const editBtn = e.target.closest('.edit-subscription-btn');
                    const deleteBtn = e.target.closest('.delete-subscription-btn');
                    if (editBtn) openSubscriptionModal(editBtn.dataset.id);
                    if (deleteBtn) {
                        openConfirmationModal('Are you sure you want to delete this subscription?', () => {
                            subscriptions = subscriptions.filter(s => s.id !== deleteBtn.dataset.id);
                            saveTrackerState();
                            refreshAllViews();
                        });
                    }
                });

                searchInput.addEventListener('input', () => renderSubscriptionList(searchInput.value));
                viewListBtn.addEventListener('click', () => switchTrackerView('list'));
                viewCalendarBtn.addEventListener('click', () => switchTrackerView('calendar'));
                
                calendarPrevBtn.addEventListener('click', () => {
                    trackerState.calendarDate.setMonth(trackerState.calendarDate.getMonth() - 1);
                    renderSubscriptionCalendar();
                    saveTrackerState();
                });

                calendarNextBtn.addEventListener('click', () => {
                    trackerState.calendarDate.setMonth(trackerState.calendarDate.getMonth() + 1);
                    renderSubscriptionCalendar();
                    saveTrackerState();
                });

                calendarTodayBtn.addEventListener('click', () => {
                    trackerState.calendarDate = new Date();
                    renderSubscriptionCalendar();
                    saveTrackerState();
                });
                
                function initTracker() {
                    loadTrackerState();
                    switchTrackerView(trackerState.view);
                }
                initTracker();
            })();


            // --- GLOBAL INITIALIZATION ---
            updateTheme();
            switchApp(appState.activeApp);
        });
    </script>
</body>
</html>
