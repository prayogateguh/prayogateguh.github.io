                </div>
                <div id="cancellation-date-container" class="hidden">
                    <label for="subscription-cancellation-date" class="block text-sm font-medium text-gray-600 dark:text-gray-400">Cancellation Date</label>
                    <input type="date" id="subscription-cancellation-date" class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring">
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" id="subscription-form-cancel-btn" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 focus-ring">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus-ring">Save Subscription</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
