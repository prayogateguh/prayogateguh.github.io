            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('underline', false, null)"
            title="Underline"
          >
            <u>U</u>
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('strikeThrough', false, null)"
            title="Strikethrough"
          >
            <s>S</s>
          </button>
          <div class="w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('formatBlock', false, '<h1>')"
            title="Heading 1"
          >
            H1
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('formatBlock', false, '<h2>')"
            title="Heading 2"
          >
            H2
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('formatBlock', false, '<h3>')"
            title="Heading 3"
          >
            H3
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('formatBlock', false, '<h4>')"
            title="Heading 4"
          >
            H4
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('formatBlock', false, '<h5>')"
            title="Heading 5"
          >
            H5
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('formatBlock', false, '<h6>')"
            title="Heading 6"
          >
            H6
          </button>
          <div class="w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('insertUnorderedList', false, null)"
            title="Bullet List"
          >
            • List
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('insertOrderedList', false, null)"
            title="Numbered List"
          >
            1. List
          </button>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('insertHTML', false, '<input type=\'checkbox\'>&nbsp;')"
            title="Task List"
          >
            ☑ List
          </button>
          <div class="w-px bg-gray-300 dark:bg-gray-600 mx-1"></div>
          <button
            class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300"
            onmousedown="event.preventDefault()"
            onclick="document.execCommand('removeFormat', false, null); document.execCommand('formatBlock', false, 'div')"
            title="Clear Formatting"
          >
            Clear
          </button>
          <div class="flex-1"></div>
          <button
            id="saveNoteBtn"
            class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div
      id="actionBar"
      class="hidden fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-white rounded-xl shadow-lg border border-gray-200 p-2 flex items-center gap-2 z-40"
    >
      <button
        id="actionAddChild"
        class="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg tooltip"
        title="Add Child"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button
        id="actionEditTitle"
        class="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg tooltip"
        title="Update Title"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          ></path>
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          ></path>
        </svg>
      </button>
      <button
        id="actionEditNote"
        class="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg tooltip"
        title="Update Note Body"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          ></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </button>
      <button
        id="actionToggleDone"
        class="p-2 text-gray-600 hover:text-green-600 hover:bg-green-50 rounded-lg tooltip"
        title="Toggle Done"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <div class="w-px h-6 bg-gray-200 mx-1"></div>
      <button
        id="actionCollapse"
        class="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg tooltip"
        title="Collapse"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
        </svg>
      </button>
      <button
        id="actionExpand"
        class="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg tooltip"
        title="Expand"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
      <div class="w-px h-6 bg-gray-200 mx-1"></div>
      <button
        id="actionDelete"
        class="p-2 text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-lg tooltip"
        title="Delete"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
        </svg>
      </button>
    </div>

    <!-- MODALS (Shared across apps where applicable) -->

    <!-- Generic Confirmation Modal -->
    <div
      id="confirmation-modal"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4"
    >
      <div
        class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-sm"
      >
        <h3
          id="confirmation-title"
          class="text-lg font-semibold mb-2 text-gray-900 dark:text-white"
        >
          Are you sure?
        </h3>
        <p
          id="confirmation-message"
          class="text-gray-600 dark:text-gray-400 mb-6"
        ></p>
        <div class="flex justify-end gap-3">
          <button
            id="confirmation-cancel-btn"
            class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 focus-ring"
          >
            Cancel
          </button>
          <button
            id="confirmation-confirm-btn"
            class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 focus-ring"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- Workspace Modal (Planner) -->
    <div
      id="workspace-modal"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-md"
      >
        <h3
          id="workspace-modal-title"
          class="text-lg font-semibold mb-4 text-gray-900 dark:text-white"
        ></h3>
        <input
          type="text"
          id="workspace-input"
          class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-gray-200 rounded-md p-2 focus-ring"
          placeholder="Enter workspace name..."
        />
        <div class="mt-4 flex justify-end gap-3">
          <button
            id="workspace-cancel-btn"
            class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 focus-ring"
          >
            Cancel
          </button>
          <button
            id="workspace-save-btn"
            class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus-ring"
          >
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Task Details Modal (Planner) -->
    <div
      id="task-details-modal"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-lg flex flex-col"
        style="max-height: 85vh"
      >
        <div class="flex justify-between items-start mb-4">
          <input
            type="text"
            id="task-details-title"
            class="text-lg font-semibold bg-transparent text-gray-900 dark:text-white w-full focus:outline-none focus:bg-gray-100 dark:focus:bg-gray-700 rounded-md -ml-2 px-2 py-1"
          />
          <button
            id="task-details-close-btn"
            class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700"
          >
            &times;
          </button>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label
              for="task-details-status"
              class="text-sm font-medium text-gray-500 dark:text-gray-400 mb-1 block"
              >Status</label
            >
            <select
              id="task-details-status"
              class="w-full bg-gray-100 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 rounded-md p-2 focus-ring"
            >
              <option value="draft">Draft</option>
              <option value="in progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div>
            <label
              for="task-details-deadline"
              class="text-sm font-medium text-gray-500 dark:text-gray-400 mb-1 block"
              >Deadline</label
            >
            <input
              type="datetime-local"
              id="task-details-deadline"
              class="w-full bg-gray-100 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 rounded-md p-2 focus-ring"
            />
          </div>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">Description</p>
        <textarea
          id="task-details-description"
          class="w-full bg-gray-100 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 rounded-md p-2 focus-ring mb-4"
          rows="3"
          placeholder="Add a description..."
        ></textarea>

        <div class="flex justify-between items-center mb-2">
          <p class="text-sm text-gray-500 dark:text-gray-400">Sub-Todos</p>
        </div>
        <div
          id="subtasks-container"
          class="overflow-y-auto pr-2 space-y-2 subtasks-container mb-4"
        ></div>
        <form id="add-subtask-form" class="flex gap-2 mb-4">
          <input
            type="text"
            id="subtask-input"
            class="flex-grow bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 rounded-md p-2 focus-ring"
            placeholder="Add a sub-todo..."
          />
          <button
            type="submit"
            class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus-ring"
          >
            Add
          </button>
        </form>

        <div class="flex justify-between items-center mb-2">
          <p class="text-sm text-gray-500 dark:text-gray-400">Attachments</p>
          <label
            for="file-attachment-input"
            class="cursor-pointer text-sm text-indigo-600 dark:text-indigo-400 hover:underline"
            >Attach File</label
          >
          <input
            type="file"
            id="file-attachment-input"
            class="hidden"
            multiple
          />
        </div>
        <div
          id="attachments-container"
          class="flex-grow overflow-y-auto pr-2 space-y-2 border border-gray-200 dark:border-gray-700 rounded-lg p-2 bg-gray-100/30 dark:bg-gray-900/30"
        ></div>
      </div>
    </div>

    <!-- Media Preview Modal (Planner) -->
    <div
      id="media-preview-modal"
      class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-4xl max-h-full p-4 relative flex items-center justify-center"
      >
        <button
          id="media-preview-close-btn"
          class="absolute -top-2 -right-2 w-8 h-8 bg-white dark:bg-gray-700 rounded-full flex items-center justify-center text-gray-800 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 focus-ring z-10"
        >
          &times;
        </button>
        <img
          id="image-preview-element"
          src=""
          alt="Image Preview"
          class="hidden max-w-full max-h-[85vh] object-contain rounded"
        />
        <video
          id="video-preview-element"
          src=""
          controls
          class="hidden max-w-full max-h-[85vh] rounded"
        ></video>
        <audio
          id="audio-preview-element"
          src=""
          controls
          class="hidden"
        ></audio>
        <embed
          id="pdf-preview-element"
          src=""
          type="application/pdf"
          class="hidden w-[80vw] h-[85vh] rounded"
        />
      </div>
    </div>

    <!-- Add/Edit Subscription Modal (Tracker) -->
    <div
      id="subscription-modal"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg shadow-xl p-6 w-full max-w-lg"
      >
        <div class="flex justify-between items-center mb-6">
          <h3
            id="subscription-modal-title"
            class="text-xl font-semibold text-gray-900 dark:text-white"
          >
            Add Subscription
          </h3>
          <button
            id="subscription-modal-close-btn"
            class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700"
          >
            &times;
          </button>
        </div>
        <form id="subscription-form" class="space-y-4">
          <input type="hidden" id="subscription-id" />
          <div>
            <label
              for="subscription-name"
              class="block text-sm font-medium text-gray-600 dark:text-gray-400"
              >Subscription Name</label
            >
            <input
              type="text"
              id="subscription-name"
              class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
              required
            />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                for="subscription-price"
                class="block text-sm font-medium text-gray-600 dark:text-gray-400"
                >Price</label
              >
              <input
                type="number"
                id="subscription-price"
                step="0.01"
                class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
                required
              />
            </div>
            <div>
              <label
                for="subscription-currency"
                class="block text-sm font-medium text-gray-600 dark:text-gray-400"
                >Currency</label
              >
              <select
                id="subscription-currency"
                class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
              >
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>IDR</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                for="subscription-frequency-count"
                class="block text-sm font-medium text-gray-600 dark:text-gray-400"
                >Payment every</label
              >
              <input
                type="number"
                id="subscription-frequency-count"
                value="1"
                min="1"
                class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
              />
            </div>
            <div>
              <label
                for="subscription-frequency-unit"
                class="block text-sm font-medium text-gray-600 dark:text-gray-400"
                >&nbsp;</label
              >
              <select
                id="subscription-frequency-unit"
                class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
              >
                <option value="days">Day(s)</option>
                <option value="weeks">Week(s)</option>
                <option value="months" selected>Month(s)</option>
                <option value="years">Year(s)</option>
              </select>
            </div>
          </div>
          <div>
            <label
              for="subscription-next-payment"
              class="block text-sm font-medium text-gray-600 dark:text-gray-400"
              >First Payment Date</label
            >
            <input
              type="date"
              id="subscription-next-payment"
              class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
              required
            />
          </div>
          <div>
            <label
              for="subscription-payment-method"
              class="block text-sm font-medium text-gray-600 dark:text-gray-400"
              >Payment Method</label
            >
            <input
              type="text"
              id="subscription-payment-method"
              placeholder="e.g., Credit Card, PayPal"
              class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
            />
          </div>
          <div>
            <label
              for="subscription-status"
              class="block text-sm font-medium text-gray-600 dark:text-gray-400"
              >Status</label
            >
            <select
              id="subscription-status"
              class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
            >
              <option value="active">Active</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div id="cancellation-date-container" class="hidden">
            <label
              for="subscription-cancellation-date"
              class="block text-sm font-medium text-gray-600 dark:text-gray-400"
              >Cancellation Date</label
            >
            <input
              type="date"
              id="subscription-cancellation-date"
              class="mt-1 w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 focus-ring"
            />
          </div>
          <div class="pt-4 flex justify-end gap-3">
            <button
              type="button"
              id="subscription-form-cancel-btn"
              class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 focus-ring"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus-ring"
            >
              Save Subscription
            </button>
          </div>
        </form>
      </div>
    </div>

  </body>
</html>
